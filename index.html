<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="left-page">
        <div class="title">
            <img src="imgs/odin-lined.png" alt="Simple line art of odin">
            <h1>Odin</h1>
        </div>
        <footer>
            <p>
                Photo by
                <a href="https://unsplash.com/@haliewestphoto?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Halie West</a>
                on 
                <a href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Unsplash</a>
            </p>
        </footer>
    </div>
    <div class="right-page">
        <div class="sign-up-text">
            <p>
                This is not a real online service! You know you need something like this
                in your life to help you realize your deepest dreams.<br/>
                Sign up now to get started.
            </p>
            <p>
                You know you want to.
            </p>
        </div>
        <form action="example.com/path" method="post">
            <input type="text" />
            <button type="submit">Create Account</button>
        </form>
        <p>Already have an acount? <a>Log in</a></p>
    </div>
</body>
</html>
